name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out source code from Git repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python Runtime Environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3: Install build dependencies, test runners, and SAST security tools
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest bandit

      # Step 4: Code Quality & Linting Gate
      - name: Run Code Linter (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 5: Automated Security Vulnerability Scanning (SAST)
      - name: Security Vulnerability Scan (Bandit)
        run: |
          bandit -r . -ll -ii

      # Step 6: Automated Functional & Unit Testing
      - name: Run Automated Test Suite (PyTest)
        run: |
          pytest -v --tb=short